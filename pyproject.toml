[project]
name = "sekai"
version = "0.1.0"
description = "A simple web app for storing fictional character data"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.0",
    "flask-admin==1.6.1",
    "flask-sqlalchemy==3.1.1",
    "psycopg2-binary==2.9.10",
    "werkzeug==3.1.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
